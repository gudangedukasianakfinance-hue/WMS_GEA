<script>
(function () {
  'use strict';

  /* ====================================================================== */
  /* APP STATE                                                              */
  /* ====================================================================== */

  var App = {
    version: document.body.getAttribute('data-app-version') || '',
    logoUrl: document.body.getAttribute('data-logo-url') || '',
    userEmail: document.body.getAttribute('data-user-email') || 'user@gea.co.id',
    initialView: document.body.getAttribute('data-initial-view') || 'dashboard',
    activeView: 'dashboard',
    invTab: 'balance',
    inboundTab: 'receiving',
    outboundTab: 'orders',
    masterType: 'items',
    options: null,
    optionsPromise: null,
    dashboard: null,
    dashboardPromise: null,
    booted: false,
    eventsBound: false,
    pingTimer: null,
    autoSyncTimer: null,
    autoSyncBusy: false,
    loginBusy: false,
    token: '',
    user: null,
    role: '',
    permissions: [],
    lastSync: null,
    loaded: {},
    masterRows: {},
    /* Client-side cache per tabel (lazy-loaded saat tab diklik). */
    cache: {
      stockLogs: null,
      inboundReceiving: null,
      quarantine: null,
      claims: null,
      outboundOrders: null,
      pickingList: null,
      dispatchManifest: null,
      soHeader: null,
      soDetail: null,
      syncHistory: null,
      masterItems: null,
      masterLocations: null,
      masterSuppliers: null,
      masterOutlets: null,
      masterUsers: null
    },
    /* Filter state per tab. */
    filters: {
      stockMonitor: { search: '', kategori: '', status: '', pageSize: 25, page: 1 },
      stockCard: { sku: '', kategori: '', startDate: '', endDate: '', tipe: '', pageSize: 25, page: 1 },
      inbound: { search: '', status: 'ALL', page: 1 },
      quarantine: { search: '', status: 'ALL', page: 1 },
      claims: { search: '', status: 'ALL', page: 1 },
      outbound: { search: '', status: 'ALL', page: 1 },
      picking: { search: '', status: 'ALL', page: 1 },
      manifest: { search: '', status: 'ALL', page: 1 },
      opname: { search: '', status: 'ALL', page: 1 },
      approval: { search: '', status: 'ALL', page: 1 },
      master: { search: '', type: 'items', page: 1 }
    },
    states: {
      stockMonitor: { allRows: [], filteredRows: [], page: 1, pageSize: 25 },
      stockCard: { allRows: [], summary: {}, page: 1, pageSize: 25 },
      dashboard: { critical: [], outbound: [] }
    }
  };

  var AUTH_STORAGE = {
    remember: 'wms_token_remember',
    session: 'wms_token_session'
  };

  var PUBLIC_ACTIONS = {
    loginUser: true,
    restoreSession: true,
    logoutUser: true,
    getLoginInfo: true,
    ping: true
  };

  var VIEW_META = {
    dashboard: { title: 'Dashboard', subtitle: 'Ringkasan operasional gudang PT GEA', permission: 'dashboard' },
    inventory: { title: 'Inventory & Kartu Stok', subtitle: 'Monitoring saldo stok dan riwayat mutasi per SKU', permission: 'stock-monitor' },
    inbound: { title: 'Inbound & Retur', subtitle: 'Penerimaan AppSheet, karantina cacat, dan klaim retur', permission: 'inbound' },
    outbound: { title: 'Outbound & Pengiriman', subtitle: 'Order PO, picking list, dan manifest pengiriman', permission: 'order-status' },
    opname: { title: 'Stock Opname (SO)', subtitle: 'Perintah SO, blind count, variance, dan approval BASO', permission: 'opname' },
    master: { title: 'Master Data & Sistem', subtitle: 'Barang, rak, supplier, outlet, users, dan sync logs', permission: 'master' },
    sync: { title: 'Sinkronisasi', subtitle: 'Rekonsiliasi INBOUND_RECEIVING dan OUTBOUND_ORDERS', permission: 'sync' },
    adjustment: { title: 'Adjustment Stok', subtitle: 'Koreksi saldo dan transfer antar bin', permission: 'adjustment' },
    approval: { title: 'Approval BASO', subtitle: 'Persetujuan hasil stock opname', permission: 'approval' },
    users: { title: 'Users & Sync Logs', subtitle: 'Kelola akun, role, status, dan riwayat sinkronisasi', permission: 'users' }
  };

  /* ====================================================================== */
  /* UTILITY                                                                */
  /* ====================================================================== */

  function q(selector, root) {
    return (root || document).querySelector(selector);
  }

  function qa(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  /**
   * Aman untuk semua elemen opsional. Tidak pernah melempar error jika elemen
   * belum ada di DOM (mis. modal yang baru dibuat saat dibuka).
   */
  function safeBind(idOrSelector, event, handler, options) {
    try {
      var target = typeof idOrSelector === 'string' ? q(idOrSelector) : idOrSelector;
      if (!target || typeof target.addEventListener !== 'function') {
        return null;
      }
      target.addEventListener(event, handler, options);
      return target;
    } catch (err) {
      console.warn('safeBind gagal:', idOrSelector, event, err);
      return null;
    }
  }

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtNum(value) {
    var number = Number(value);
    if (!isFinite(number)) {
      return '0';
    }
    return number.toLocaleString('id-ID');
  }

  function qtyCell(value) {
    var number = Number(value);
    if (!isFinite(number)) {
      number = 0;
    }
    var cls = number > 0 ? 'qty-positive' : number < 0 ? 'qty-negative' : 'qty-zero';
    return '<span class="' + cls + '">' + (number > 0 ? '+' : '') + fmtNum(number) + '</span>';
  }

  function shortDate(value) {
    var text = String(value === null || value === undefined ? '' : value).trim();
    if (!text) {
      return '-';
    }
    if (text.length >= 16) {
      return text.slice(0, 16);
    }
    if (text.length >= 10) {
      return text.slice(0, 10);
    }
    return text;
  }

  function statusBadge(value) {
    var text = String(value === null || value === undefined ? '' : value).trim();
    if (!text) {
      return '<span class="status-badge tone-muted">-</span>';
    }
    var key = text.toUpperCase();
    var tone = 'tone-muted';
    if (['PASS', 'DONE', 'ACTIVE', 'AVAILABLE', 'APPROVED', 'COMPLETED', 'DELIVERED', 'SHIPPED', 'RESOLVED', 'CLOSED', 'ONLINE', 'FAST', 'NORMAL'].indexOf(key) >= 0) {
      tone = 'tone-success';
    } else if (['PENDING', 'COUNTED', 'CONFIRMED', 'WAITING_REPLACEMENT', 'SLOW', 'LOW'].indexOf(key) >= 0) {
      tone = 'tone-warning';
    } else if (['PICKING', 'CHECKING', 'PACKED', 'DISPATCHED', 'OPEN', 'IN', 'TRANSFER', 'IN_PROGRESS'].indexOf(key) >= 0) {
      tone = 'tone-info';
    } else if (['CANCELLED', 'QUARANTINE', 'SCRAPPED', 'OUT', 'RETURNED_TO_SUPPLIER'].indexOf(key) >= 0) {
      tone = 'tone-danger';
    } else if (['ADJUST', 'EMPTY', 'OVERSTOCK'].indexOf(key) >= 0) {
      tone = key === 'EMPTY' ? 'tone-danger' : key === 'OVERSTOCK' ? 'tone-info' : 'tone-navy';
    }
    return '<span class="status-badge ' + tone + '">' + esc(text) + '</span>';
  }

  function stockSourceMeta_(source) {
    var key = normalizeKey_(source) || 'APPSHEET';
    var label;
    var cls;
    if (key === 'APPSHEET' || key === 'APP') {
      label = 'APPSHEET';
      cls = 'APPSHEET';
    } else if (key === 'SYNC_APPSHEET') {
      label = 'SYNC-APPSHEET';
      cls = 'SYNC_APPSHEET';
    } else if (key === 'SYNC_IMPORTRANGE') {
      label = 'IMPORTRANGE';
      cls = 'SYNC_IMPORTRANGE';
    } else if (key === 'WEB') {
      label = 'WEB';
      cls = 'WEB';
    } else {
      label = key;
      cls = key;
    }
    return { key: key, label: label, cls: cls };
  }

  function stockSourceBadgeHtml(source) {
    var meta = stockSourceMeta_(source);
    return '<span class="badge-source ' + meta.cls + '">' + esc(meta.label) + '</span>';
  }

  function stockStatusTone_(status) {
    var key = normalizeKey_(status) || 'NORMAL';
    if (key === 'EMPTY') { return 'tone-danger'; }
    if (key === 'LOW') { return 'tone-warning'; }
    if (key === 'OVERSTOCK') { return 'tone-info'; }
    if (key === 'NORMAL') { return 'tone-success'; }
    return 'tone-muted';
  }

  function fmtTglHm(value) {
    var text = String(value === null || value === undefined ? '' : value).trim();
    if (!text) {
      return '-';
    }
    var d = new Date(text);
    if (isNaN(d.getTime())) {
      return text.length > 16 ? text.slice(0, 16) : text;
    }
    var dd = String(d.getDate()).padStart(2, '0');
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var hh = String(d.getHours()).padStart(2, '0');
    var min = String(d.getMinutes()).padStart(2, '0');
    return dd + '/' + mm + ' ' + hh + ':' + min;
  }

  function normalizeKey_(value) {
    return String(value === null || value === undefined ? '' : value).trim().toUpperCase();
  }

  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(null, args);
      }, wait);
    };
  }

  /* Global error handler: mencegah layar kosong (blank) ketika terjadi
     error tak tertangkap di frontend. Tampilkan toast/pesan yang jelas. */
  window.onerror = function (message, source, lineno, colno, error) {
    console.error('Global error:', message, 'at', source || '', ':', lineno || '');
    try {
      // Tampilkan di debug banner
      var banner = document.getElementById('wms-error-banner');
      var msg = document.getElementById('wms-error-msg');
      if (banner && msg) {
        msg.textContent = message || 'Terjadi kesalahan yang tidak diketahui.';
        banner.style.display = 'block';
      }
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'error',
          title: 'Kesalahan Aplikasi',
          text: message || 'Terjadi kesalahan yang tidak diketahui.',
          confirmButtonText: 'Tutup'
        });
      } else {
        alert('Kesalahan aplikasi: ' + (message || 'Terjadi kesalahan yang tidak diketahui.'));
      }
    } catch (err) {
      // Jika bahkan Swal gagal, biarkan console.error sebagai fallback.
    }
    return false;
  };

  window.onunhandledrejection = function (event) {
    console.error('Unhandled promise rejection:', event.reason);
    try {
      var banner = document.getElementById('wms-error-banner');
      var msg = document.getElementById('wms-error-msg');
      if (banner && msg) {
        msg.textContent = event.reason && event.reason.message ? event.reason.message : 'Terjadi kesalahan pada permintaan server.';
        banner.style.display = 'block';
      }
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          icon: 'error',
          title: 'Kesalahan Jaringan / Server',
          text: event.reason && event.reason.message ? event.reason.message : 'Terjadi kesalahan pada permintaan server.',
          confirmButtonText: 'Tutup'
        });
      } else {
        alert('Kesalahan jaringan/server: ' + (event.reason && event.reason.message ? event.reason.message : String(event.reason)));
      }
    } catch (err) {
      // Fallback.
    }
    return false;
  };

  // Debug banner: tampilkan pesan error merah di bagian atas halaman jika ada error JS.
  (function installDebugBanner() {
    try {
      var banner = document.createElement('div');
      banner.id = 'wms-debug-banner';
      banner.style.cssText =
        'position:fixed;top:0;left:0;right:0;z-index:9999;background:#DC2626;color:#fff;' +
        'font-size:0.75rem;padding:6px 12px;display:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);';
      var closeBtn = document.createElement('span');
      closeBtn.innerHTML = '&times;';
      closeBtn.style.cssText = 'float:right;cursor:pointer;margin-left:10px;font-weight:bold;';
      closeBtn.onclick = function () { banner.style.display = 'none'; };
      banner.appendChild(closeBtn);
      var msg = document.createElement('span');
      banner.appendChild(msg);
      document.body.insertBefore(banner, document.body.firstChild);
      window._wmsDebugBanner = { el: banner, msg: msg };
    } catch (e) {
      // Tidak kritis.
    }
  })();

  // Expose handleLogin ke global scope agar HTML onsubmit dapat memanggilnya.
  window.handleLogin = function (event) {
    event.preventDefault();

    var username = (q('#login-username').value || '').trim();
    var password = q('#login-password').value || '';
    var remember = !!(q('#login-remember') && q('#login-remember').checked);

    if (!username) {
      showLoginError('Username wajib diisi.');
      q('#login-username').focus();
      return false;
    }
    if (!password) {
      showLoginError('Password wajib diisi.');
      q('#login-password').focus();
      return false;
    }

    showLoginError('');
    setLoginBusy(true);

    google.script.run
      .withSuccessHandler(function (session) {
        if (!session) {
          showLoginError('Server mengembalikan respons kosong (null). Pastikan database sudah diinisialisasi.');
          setLoginBusy(false);
          return;
        }
        storeToken(session.token, !!session.remember);
        App.token = session.token;
        enterApp(session);
        toast('success', 'Login berhasil', 'Selamat datang, ' + (session.user ? session.user.NamaLengkap : username) + '.');
        setLoginBusy(false);
      })
      .withFailureHandler(function (err) {
        App.token = '';
        showLoginError(err && err.message ? err.message : 'Login gagal. Silakan coba lagi.');
        setLoginBusy(false);
      })
      .loginUser(username, password, remember);

    return false;
  };

  function callApi(action, payload) {
    var body = payload && typeof payload === 'object' ? payload : {};
    if (App.token && !PUBLIC_ACTIONS[action] && !body._token) {
      body = Object.assign({}, body, { _token: App.token });
    }

    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (raw) {
          var parsed;
          try {
            parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
          } catch (err) {
            reject(new Error('Respons server tidak valid.'));
            return;
          }
          if (!parsed || parsed.ok !== true) {
            var message = parsed && parsed.error ? parsed.error : 'Permintaan ke server gagal.';
            if (!PUBLIC_ACTIONS[action] && /sesi|login kembali|tidak aktif/i.test(message)) {
              handleSessionExpired(message);
            }
            reject(new Error(message));
            return;
          }
          resolve(parsed.data);
        })
        .withFailureHandler(function (err) {
          reject(new Error(err && err.message ? err.message : String(err)));
        })
        .executeApi(action, body);
    });
  }

  function toNumberOrZero_(value) {
    var number = Number(value);
    return isFinite(number) ? number : 0;
  }

  /* ====================================================================== */
  /* AUTHENTICATION / SESSION                                               */
  /* ====================================================================== */

  function normalizeRole(role) {
    var value = String(role || '').trim().toUpperCase();
    return value === 'ADMIN' ? 'ADMIN' : 'STAFF';
  }

  function getStoredToken() {
    try {
      return localStorage.getItem(AUTH_STORAGE.remember) || sessionStorage.getItem(AUTH_STORAGE.session) || '';
    } catch (err) {
      return '';
    }
  }

  function storeToken(token, remember) {
    try {
      localStorage.removeItem(AUTH_STORAGE.remember);
      sessionStorage.removeItem(AUTH_STORAGE.session);
      if (!token) {
        return;
      }
      if (remember) {
        localStorage.setItem(AUTH_STORAGE.remember, token);
      } else {
        sessionStorage.setItem(AUTH_STORAGE.session, token);
      }
    } catch (err) {
      // Ignore storage errors.
    }
  }

  function clearStoredToken() {
    try {
      localStorage.removeItem(AUTH_STORAGE.remember);
      sessionStorage.removeItem(AUTH_STORAGE.session);
    } catch (err) {
      // Ignore storage errors.
    }
  }

  function can(permission) {
    if (!permission) {
      return true;
    }
    if (App.role === 'ADMIN') {
      return true;
    }
    return App.permissions.indexOf(permission) >= 0;
  }

  function applySession(payload) {
    if (!payload) {
      throw new Error('Respons autentikasi tidak valid.');
    }
    App.token = payload.token || App.token;
    App.user = payload.user || null;
    App.role = normalizeRole(App.user ? App.user.Role : '');
    App.permissions = payload.permissions || [];
  }

  function applyRoleUI() {
    var name = App.user && App.user.NamaLengkap ? App.user.NamaLengkap : (App.user && App.user.Username ? App.user.Username : 'PT GEA');
    var roleLabel = App.role === 'ADMIN' ? 'Administrator' : 'Staff Gudang';

    setText('#user-name', name);
    setText('#user-role', roleLabel);
    setText('#user-avatar', initials(name));

    var chip = q('#user-role-chip');
    if (chip) {
      chip.classList.toggle('role-admin', App.role === 'ADMIN');
      chip.classList.toggle('role-staff', App.role !== 'ADMIN');
      var chipText = q('#user-role-chip-text');
      if (chipText) {
        chipText.textContent = App.role;
      }
    }

    qa('[data-permission]').forEach(function (element) {
      element.classList.toggle('d-none', !can(element.getAttribute('data-permission')));
    });
    qa('[data-admin-only]').forEach(function (element) {
      element.classList.toggle('d-none', App.role !== 'ADMIN');
    });
  }

  function initials(name) {
    var parts = String(name || 'G').trim().split(/\s+/).slice(0, 2);
    return parts.map(function (part) { return part.charAt(0).toUpperCase(); }).join('') || 'G';
  }

  function showLoginError(message) {
    var box = q('#login-error');
    if (!box) {
      return;
    }
    box.textContent = message || '';
    box.classList.toggle('is-visible', !!message);
  }

  function setLoginBusy(busy) {
    App.loginBusy = !!busy;
    var button = q('#login-submit');
    var label = q('#login-submit-text');
    if (button) {
      button.disabled = !!busy;
    }
    if (label) {
      label.textContent = busy ? 'Memverifikasi...' : 'Masuk ke Dashboard';
    }
  }

  function showLoginScreen(message) {
    App.booted = false;
    if (App.autoSyncTimer) {
      clearInterval(App.autoSyncTimer);
      App.autoSyncTimer = null;
    }
    document.body.classList.add('auth-mode');
    var root = q('#app-root');
    if (root) {
      root.classList.remove('app-visible');
    }
    var screen = q('#login-screen');
    if (screen) {
      screen.classList.remove('is-leaving');
    }
    setLoginBusy(false);
    showLoginError(message || '');
  }

  function handleSessionExpired(message) {
    if (!App.token) {
      return;
    }
    clearStoredToken();
    App.token = '';
    App.user = null;
    App.permissions = [];
    App.role = '';
    showLoginScreen(message || 'Sesi berakhir. Silakan login kembali.');
  }

  function enterApp(sessionPayload) {
    try {
      applySession(sessionPayload);

      // 1. Sembunyikan login screen (auth-mode) secepat mungkin.
      document.body.classList.remove('auth-mode');
      var screen = q('#login-screen');
      if (screen) {
        screen.classList.add('is-leaving');
      }
      // 2. Tampilkan aplikasi utama.
      var root = q('#app-root');
      if (root) {
        root.classList.add('app-visible');
      }
      App.booted = true;

      if (!App.eventsBound) {
        bindEvents();
        App.eventsBound = true;
      }

      // 3. Render info user (nama, role, avatar, permission UI).
      try {
        applyRoleUI();
      } catch (roleErr) {
        console.warn('applyRoleUI gagal (diabaikan):', roleErr);
      }

      // 4. Aktifkan tab default (dashboard, atau view lain jika diizinkan).
      var target = App.initialView;
      if (!VIEW_META[target] || !can(VIEW_META[target].permission)) {
        target = 'dashboard';
      }
      showView(target, false);

      if (App.dashboardInitError && !App.dashboardInitErrorShown) {
        App.dashboardInitErrorShown = true;
        Swal.fire({
          icon: 'warning',
          title: 'Inisialisasi Database',
          text: App.dashboardInitError,
          confirmButtonText: 'Mengerti'
        });
      }

      // 5. Muat data awal (STOCK_BALANCE, MASTER_*, SYNC_LOGS terakhir).
      loadInitialAppData()
        .then(function () {
          return loadOptions();
        })
        .then(function () {
          populateAdjustmentForms();
        })
        .catch(function (err) {
          setServerStatus('offline', 'Server Offline', '');
          showError(err, 'Gagal Memuat Data Awal');
        });

      startPing();
      startAutoSync();
    } catch (err) {
      console.error('enterApp error:', err);
      // Jika gagal, tetap tampilkan login screen dengan pesan error.
      showLoginError('Gagal memuat aplikasi: ' + (err && err.message ? err.message : String(err)));
      try {
        document.body.classList.add('auth-mode');
        var root = q('#app-root');
        if (root) {
          root.classList.remove('app-visible');
        }
        var screen = q('#login-screen');
        if (screen) {
          screen.classList.remove('is-leaving');
          screen.style.display = 'flex';
        }
      } catch (err2) {
        console.error('enterApp fallback error:', err2);
      }
    }
  }

  function setRoleUiSafely() {
    try {
      applyRoleUI();
    } catch (err) {
      // UI must never block login because a decorative element is missing.
    }
  }

  /**
   * Handler login utama. Dipanggil oleh onsubmit pada form login.
   * Wajib memanggil e.preventDefault() di baris pertama untuk mencegah
   * native form submit yang menyebabkan URL sandbox menambahkan
   * ?username=...&password=... dan layar menjadi kosong (blank).
   */
  function handleLogin(event) {
    event.preventDefault();

    var username = (q('#login-username').value || '').trim();
    var password = q('#login-password').value || '';
    var remember = !!(q('#login-remember') && q('#login-remember').checked);

    if (!username) {
      showLoginError('Username wajib diisi.');
      q('#login-username').focus();
      return false;
    }
    if (!password) {
      showLoginError('Password wajib diisi.');
      q('#login-password').focus();
      return false;
    }

    showLoginError('');
    setLoginBusy(true);

    // Kirim login secara asynchronous langsung ke server-side loginUser,
    // tidak melalui executeApi gateway, untuk menghindari JSON wrapping
    // dan masalah serialisasi pada objek Date.
    google.script.run
      .withSuccessHandler(function (session) {
        storeToken(session.token, !!session.remember);
        App.token = session.token;
        enterApp(session);
        toast('success', 'Login berhasil', 'Selamat datang, ' + (session.user ? session.user.NamaLengkap : username) + '.');
        setLoginBusy(false);
      })
      .withFailureHandler(function (err) {
        App.token = '';
        showLoginError(err && err.message ? err.message : 'Login gagal. Silakan coba lagi.');
        setLoginBusy(false);
      })
      .loginUser(username, password, remember);

    return false;
  }

  // submitLogin dapat dipanggil dengan 2 cara:
  //   1. window.submitLogin()            <- dari onclick HTML, baca nilai dari DOM
  //   2. window.submitLogin(u, p, r)     <- dipanggil langsung dengan parameter
  window.submitLogin = function (username, password, remember) {
    // Jika dipanggil tanpa parameter, ambil nilai langsung dari input DOM
    if (username === undefined || password === undefined) {
      var uEl = q('#login-username');
      var pEl = q('#login-password');
      var rEl = q('#login-remember');
      username = (uEl && uEl.value) ? String(uEl.value).trim() : '';
      password = (pEl && pEl.value) ? String(pEl.value) : '';
      remember = !!(rEl && rEl.checked);
    }

    if (App.loginBusy) {
      return;
    }
    showLoginError('');
    setLoginBusy(true);

    google.script.run
      .withSuccessHandler(function (session) {
        if (!session) {
          showLoginError('Server mengembalikan respons kosong (null). Pastikan database sudah diinisialisasi.');
          setLoginBusy(false);
          return;
        }
        storeToken(session.token, !!session.remember);
        App.token = session.token;
        enterApp(session);
        toast('success', 'Login berhasil', 'Selamat datang, ' + (session.user ? session.user.NamaLengkap : username) + '.');
        setLoginBusy(false);
      })
      .withFailureHandler(function (err) {
        App.token = '';
        showLoginError(err.message || 'Login gagal.');
        setLoginBusy(false);
      })
      .loginUser(username, password, remember);
  };

  function restoreLogin() {
    var token = getStoredToken();
    if (!token) {
      showLoginScreen('');
      return false;
    }

    App.token = token;
    setLoginBusy(true);
    callApi('restoreSession', { token: token })
      .then(function (session) {
        enterApp(session);
        setLoginBusy(false);
        return true;
      })
      .catch(function () {
        clearStoredToken();
        App.token = '';
        showLoginScreen('');
        setLoginBusy(false);
      });
    return true;
  }

  function logoutUser() {
    var token = App.token;
    function finish() {
      clearStoredToken();
      App.token = '';
      App.user = null;
      App.role = '';
      App.permissions = [];
      App.loaded = {};
      App.cache = {
        stockLogs: null,
        inboundReceiving: null,
        quarantine: null,
        claims: null,
        outboundOrders: null,
        pickingList: null,
        dispatchManifest: null,
        soHeader: null,
        soDetail: null,
        syncHistory: null,
        masterItems: null,
        masterLocations: null,
        masterSuppliers: null,
        masterOutlets: null,
        masterUsers: null
      };
      showLoginScreen('');
      if (location && typeof location.reload === 'function') {
        try {
          location.reload();
          return;
        } catch (err) {
          // Fall through to the in-page login screen.
        }
      }
    }

    if (!token) {
      finish();
      return;
    }
    callApi('logoutUser', { token: token }).then(finish, finish);
  }

  /* ====================================================================== */
  /* LOADING / TOAST / STATUS                                               */
  /* ====================================================================== */

  function showLoading(text) {
    q('#loading-text').textContent = text || 'Memproses...';
    q('#loading-overlay').classList.remove('d-none');
  }

  function hideLoading() {
    q('#loading-overlay').classList.add('d-none');
  }

  function withLoading(promise, text) {
    showLoading(text);
    return promise.then(function (value) {
      hideLoading();
      return value;
    }, function (err) {
      hideLoading();
      throw err;
    });
  }

  function toast(icon, title, text) {
    Swal.fire({
      toast: true,
      position: 'top-end',
      icon: icon,
      title: title,
      text: text || '',
      showConfirmButton: false,
      timer: 3400,
      timerProgressBar: true
    });
  }

  function showError(err, title) {
    var message = err && err.message ? err.message : String(err);
    Swal.fire({
      icon: 'error',
      title: title || 'Terjadi Kesalahan',
      text: message,
      confirmButtonText: 'Tutup'
    });
  }

  function setServerStatus(state, text, time) {
    var wrap = q('#server-status');
    var label = q('#server-status-text');
    var timeLabel = q('#server-status-time');
    if (wrap) {
      wrap.classList.remove('is-online', 'is-offline');
      if (state === 'online') {
        wrap.classList.add('is-online');
      } else if (state === 'offline') {
        wrap.classList.add('is-offline');
      }
    }
    if (label) {
      label.textContent = text || (state === 'online' ? 'Server Online' : state === 'offline' ? 'Server Offline' : 'Menghubungkan...');
    }
    if (timeLabel) {
      timeLabel.textContent = time ? 'Sync ' + shortDate(time).slice(11) : '-';
    }
  }

    var text = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var el = q('#last-sync');
    if (el) {
      el.textContent = 'Sinkron terakhir ' + text;
    }

  function setText(selector, value) {
    var el = q(selector);
    if (el) {
      el.textContent = value === null || value === undefined || value === '' ? '-' : String(value);

  function loadInitialAppData() {
    if (App.dashboardPromise) {
      return App.dashboardPromise;
    }

    setServerStatus('connecting', 'Menghubungkan...', '');
    App.dashboardPromise = callApi('getInitialAppData')
      .then(function (data) {
        if (!data) {
          throw new Error('Server mengembalikan data kosong (null). Pastikan database sudah diinisialisasi.');
        }
        App.dashboard = data;
        App.loaded.dashboard = true;
        applyInitialAppData(data);
        setServerStatus('online', 'Server Online', data.sync ? data.sync.serverTime : '');
        return data;
      })
      .catch(function (err) {
        setServerStatus('offline', 'Server Offline', '');
        App.dashboardInitError = err && err.message ? err.message : String(err);
        throw err;
      })
      .then(function (value) {
        App.dashboardPromise = null;
        return value;
      }, function (err) {
        App.dashboardPromise = null;
        throw err;
      });

    return App.dashboardPromise;
  }

  function applyInitialAppData(data) {
    if (!data) {
      data = { items: [], balance: [], sync: null };
    }
    var summary = {
      totalSku: (data.items || []).length,
      activeSku: (data.items || []).filter(function (it) { return normalizeKey_(it.Status) === 'ACTIVE'; }).length,
      totalStockQty: 0,
      lowStockCount: 0
    };
    var critical = [];
    (data.balance || []).forEach(function (row) {
      var akhir = toNumberOrZero_(row.SaldoAkhir);
      var min = toNumberOrZero_(row.MinStock);
      summary.totalStockQty += akhir;
      if (min > 0 && akhir < min) {
        summary.lowStockCount += 1;
        critical.push(row);
      }
    });

    setText('#stat-total-sku', fmtNum(summary.totalSku));
    setText('#stat-total-sku-note', fmtNum(summary.activeSku) + ' SKU aktif');
    setText('#stat-inbound-today', '-');
    setText('#stat-inbound-note', 'Penerimaan AppSheet');
    setText('#stat-outbound-active', '-');
    setText('#stat-outbound-note', 'Order belum selesai');
    setText('#stat-sync-status', data.sync && data.sync.lastSyncAt ? 'ONLINE' : '-');
    setText('#stat-sync-note', data.sync && data.sync.lastSyncAt ? 'Terakhir ' + shortDate(data.sync.lastSyncAt) : 'Belum pernah');

    renderDashboardCritical(critical.slice(0, 8));
    renderDashboardOutbound([]);

    if (App.user) {
      applyRoleUI();
    } else {
      setText('#user-name', displayUserName(data.sync ? data.sync.userEmail : App.userEmail));
    }

    var sheetLink = q('#sidebar-sheet-link');
    if (sheetLink && data.sync && data.sync.spreadsheetUrl) {
      sheetLink.href = data.sync.spreadsheetUrl;
    }
    setText('#sidebar-sheet-name', (data.sync && data.sync.spreadsheetName) || 'Spreadsheet WMS');
    setText('#last-sync', data.sync && data.sync.lastSyncAt ? 'Sinkron terakhir ' + shortDate(data.sync.lastSyncAt) : 'Belum disinkronkan');

    // Cache master data yang ringan.
    App.cache.masterItems = data.items || [];
    App.cache.masterLocations = data.locations || [];
    App.cache.masterSuppliers = data.suppliers || [];
    App.cache.masterOutlets = data.outlets || [];
  }

  function loadStockMonitoring(force) {
    var state = App.states.stockMonitor;
    if (App.loaded.stockMonitor && !force) {
      renderStockMonitorTable();
      renderStockMonitorFooter();
      renderStockMonitorPager();
      renderStockMonitorStatusChips();
      return Promise.resolve();
    }
    var tbody = q('#stock-monitor-body');
    setTableLoading(tbody, 8, 'Memuat monitoring stok...');

    return callApi('getStockMonitoringData')
      .then(function (result) {
        state.allRows = result.rows || [];
        state.filteredRows = state.allRows.slice();
        state.page = 1;
        applyStockMonitorFilters();
        renderStockMonitorTable();
        renderStockMonitorFooter();
        renderStockMonitorPager();
        renderStockMonitorStatusChips();
        populateKategoriFilter();
        App.loaded.stockMonitor = true;
      }).catch(function (err) {
        q('#stock-monitor-body').innerHTML = emptyRow(8, 'Gagal memuat: ' + err.message);
      });
  }

  function populateKategoriFilter() {
    var select = q('#stock-monitor-kategori');
    if (!select || !App.options) {
      return;
    }
    var current = select.value;
    var html = '<option value="">Semua Kategori</option><option value="(blank)">Tanpa Kategori</option>';
    ((App.options.categories || []).slice().sort()).forEach(function (cat) {
      html += '<option value="' + esc(cat) + '">' + esc(cat) + '</option>';
    });
    select.innerHTML = html;
    if (current) {
      select.value = current;
    }
  }

  function applyStockMonitorFilters() {
    var state = App.states.stockMonitor;
    var f = App.filters.stockMonitor;
    var search = normalizeKey_(f.search);
    var kategori = f.kategori;
    var status = f.status;

    state.filteredRows = state.allRows.filter(function (row) {
      if (search) {
        var haystack = normalizeKey_(row.SKU + ' ' + row.NamaBarang + ' ' + row.Kategori + ' ' + row.LokasiID);
        if (haystack.indexOf(search) < 0) {
          return false;
        }
      }
      if (kategori) {
        if (kategori === '(blank)') {
          if (normalizeKey_(row.Kategori)) {
            return false;
          }
        } else if (normalizeKey_(row.Kategori) !== normalizeKey_(kategori)) {
          return false;
        }
      }
      if (status && normalizeKey_(row.Status) !== normalizeKey_(status)) {
        return false;
      }
      return true;
    });
    state.page = 1;
  }

  function renderStockMonitorTable() {
    var tbody = q('#stock-monitor-body');
    var state = App.states.stockMonitor;
    var start = (state.page - 1) * state.pageSize;
    var pageRows = state.filteredRows.slice(start, start + state.pageSize);

    if (!pageRows.length) {
      tbody.innerHTML = emptyRow(7, 'Tidak ada saldo stok yang cocok.');
      q('#stock-monitor-footer').innerHTML = '';
      return;
    }

    tbody.innerHTML = pageRows.map(function (row) {
      var saldoAkhir = Number(row.SaldoAkhir) || 0;
      var status = normalizeKey_(row.Status) || 'NORMAL';
      var lokasiID = row.LokasiID || row.RakDefault || '-';
      var actions = '<div class="col-aksi text-center">' +
        '<button type="button" class="btn btn-outline-secondary btn-icon" title="Buka Kartu Stok" data-action="stock-card" data-sku="' + esc(row.SKU) + '"><i class="fa-solid fa-clock-rotate-left"></i></button>' +
        (can('adjustment') ? '<button type="button" class="btn btn-outline-secondary btn-icon" title="Adjustment" data-action="stock-adjust" data-sku="' + esc(row.SKU) + '" data-location="' + esc(lokasiID) + '"><i class="fa-solid fa-sliders"></i></button>' : '') +
        '</div>';
      var masuk = Number(row.SaldoMasuk) || 0;
      var keluar = Number(row.SaldoKeluar) || 0;
      var masukText = masuk > 0 ? '<span class="qty-positive">+' + fmtNum(masuk) + '</span>' : fmtNum(masuk);
      var keluarText = keluar > 0 ? '<span class="qty-negative">-' + fmtNum(keluar) + '</span>' : fmtNum(keluar);
      var statusTone = stockStatusTone_(status);
      return '<tr>' +
        '<td class="col-sku cell-strong">' + esc(row.SKU) + '</td>' +
        '<td class="col-nama">' +
          '<div class="cell-nama-barang">' +
            '<div class="main">' + esc(row.NamaBarang || '-') + '</div>' +
            '<div class="cell-sub">Lokasi: ' + esc(lokasiID) + ' &middot; Rak: ' + esc(row.RakDefault || '-') + '</div>' +
            '<span class="status-badge ' + statusTone + '">' + esc(status) + '</span>' +
          '</div>' +
        '</td>' +
        '<td class="text-end cell-strong col-saldo-awal">' + fmtNum(row.SaldoAwal) + '</td>' +
        '<td class="text-end qty-positive col-saldo-masuk">' + masukText + '</td>' +
        '<td class="text-end qty-negative col-saldo-keluar">' + keluarText + '</td>' +
        '<td class="text-end cell-strong col-saldo-akhir">Saldo ' + fmtNum(saldoAkhir) + ' ' + esc(row.Satuan || '') + '</td>' +
        '<td class="col-aksi text-center">' + actions + '</td>' +
      '</tr>';
    }).join('');
  }

  function renderStockMonitorFooter() {
    var footer = q('#stock-monitor-footer');
    var state = App.states.stockMonitor;
    var rows = state.filteredRows;
    if (!footer) {
      return;
    }
    var totalAwal = rows.reduce(function (t, r) { return t + Number(r.SaldoAwal || 0); }, 0);
    var totalMasuk = rows.reduce(function (t, r) { return t + Number(r.SaldoMasuk || 0); }, 0);
    var totalKeluar = rows.reduce(function (t, r) { return t + Number(r.SaldoKeluar || 0); }, 0);
    var totalAkhir = rows.reduce(function (t, r) { return t + Number(r.SaldoAkhir || 0); }, 0);
    footer.innerHTML =
      '<tr>' +
      '<td colspan="2" class="text-start"><strong>Total (' + fmtNum(rows.length) + ' item terfilter)</strong></td>' +
      '<td class="text-end cell-strong">' + fmtNum(totalAwal) + '</td>' +
      '<td class="text-end qty-positive">+' + fmtNum(totalMasuk) + '</td>' +
      '<td class="text-end qty-negative">-' + fmtNum(totalKeluar) + '</td>' +
      '<td class="text-end cell-strong">Saldo ' + fmtNum(totalAkhir) + '</td>' +
      '<td class="col-aksi text-end"></td>' +
      '</tr>';
  }

  function renderStockMonitorStatusChips() {
    var container = q('#stock-monitor-status-chips');
    var state = App.states.stockMonitor;
    var f = App.filters.stockMonitor;
    var all = state.allRows || [];
    var counts = { ALL: all.length, EMPTY: 0, LOW: 0, NORMAL: 0, OVERSTOCK: 0 };
    all.forEach(function (row) {
      var st = normalizeKey_(row.Status);
      if (counts[st] !== undefined) {
        counts[st] += 1;
      }
    });
    var chips = [
      { key: 'ALL', label: 'ALL', count: counts.ALL },
      { key: 'EMPTY', label: 'EMPTY', count: counts.EMPTY },
      { key: 'LOW', label: 'LOW', count: counts.LOW },
      { key: 'NORMAL', label: 'NORMAL', count: counts.NORMAL },
      { key: 'OVERSTOCK', label: 'OVERSTOCK', count: counts.OVERSTOCK }
    ];
    container.innerHTML = chips.map(function (c) {
      var isActive = f.status === c.key || (f.status === '' && c.key === 'ALL');
      return '<button type="button" class="status-chip status-' + c.key + (isActive ? ' is-active' : '') + '" data-status="' + c.key + '">' +
        esc(c.label) + '<span class="chip-count">' + fmtNum(c.count) + '</span></button>';
    }).join('');
  }

  function renderStockMonitorPager() {
    var container = q('#stock-monitor-pager');
    var state = App.states.stockMonitor;
    var f = App.filters.stockMonitor;
    var total = state.filteredRows.length;
    var totalPages = Math.max(Math.ceil(total / f.pageSize), 1);
    var page = Math.min(state.page || 1, totalPages);
    var start = total ? (page - 1) * f.pageSize + 1 : 0;
    var end = total ? Math.min(page * f.pageSize, total) : 0;
    container.innerHTML =
      '<div class="pager-info">Menampilkan <strong>' + start + '-' + end + '</strong> dari <strong>' + fmtNum(total) + '</strong> item</div>' +
      '<div class="pager-controls">' +
      '<label class="control-label small" style="margin-bottom:0;">Per halaman</label>' +
      '<select class="form-select form-control-sm monitor-page-size" style="width:80px; min-height:30px;">' +
      '<option value="25"' + (f.pageSize === 25 ? ' selected' : '') + '>25</option>' +
      '<option value="50"' + (f.pageSize === 50 ? ' selected' : '') + '>50</option>' +
      '<option value="100"' + (f.pageSize === 100 ? ' selected' : '') + '>100</option>' +
      '</select>' +
      '<button type="button" class="btn btn-outline-secondary" data-page="prev"' + (page > 1 ? '' : ' disabled') + '><i class="fa-solid fa-chevron-left"></i></button>' +
      '<span class="pager-page">Halaman ' + page + ' / ' + totalPages + '</span>' +
      '<button type="button" class="btn btn-outline-secondary" data-page="next"' + (page < totalPages ? '' : ' disabled') + '><i class="fa-solid fa-chevron-right"></i></button>' +
      '</div>';
  }

  function exportMonitorCsv() {
    var state = App.states.stockMonitor;
    var f = App.filters.stockMonitor;
    var rows = state.filteredRows.length ? state.filteredRows : state.allRows;
    if (!rows.length) {
      toast('warning', 'Tidak ada data', 'Tidak ada data yang dapat diekspor.');
      return;
    }
    var headers = ['SKU', 'Nama Barang', 'Saldo Awal', 'Masuk', 'Keluar', 'Saldo Akhir', 'Status'];
    var lines = [headers.join(',')];
    rows.forEach(function (row) {
      lines.push([
        row.SKU, row.NamaBarang,
        row.SaldoAwal,
        (Number(row.SaldoMasuk) || 0) > 0 ? '+' + fmtNum(row.SaldoMasuk) : fmtNum(row.SaldoMasuk),
        (Number(row.SaldoKeluar) || 0) > 0 ? '-' + fmtNum(row.SaldoKeluar) : fmtNum(row.SaldoKeluar),
        row.SaldoAkhir, row.Status
      ].map(function (v) { return '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"'; }).join(','));
    });
    var blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'monitoring-stok-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('success', 'Diekspor', fmtNum(rows.length) + ' baris diunduh sebagai CSV.');
  }

  function loadStockCard() {
    var state = App.states.stockCard;
    var f = App.filters.stockCard;
    var tbody = q('#stock-card-body');
    var wrap = q('#stock-card-summary-wrap');
    var toolbar = q('#stock-card-toolbar');
    var pager = q('#stock-card-pager');
    var emptyHint = q('#stock-card-empty-hint');

    if (!f.sku) {
      tbody.innerHTML = emptyRow(7, 'Pilih Produk/SKU dari Monitoring Stok untuk melihat kartu stok.');
      if (wrap) wrap.classList.add('d-none');
      if (toolbar) toolbar.style.display = 'none';
      if (pager) pager.innerHTML = '';
      if (emptyHint) emptyHint.style.display = 'none';
      return Promise.resolve();
    }

    setTableLoading(tbody, 8, 'Memuat kartu stok...');
    if (wrap) wrap.classList.add('d-none');
    if (toolbar) toolbar.style.display = 'none';
    if (pager) pager.innerHTML = '';
    if (emptyHint) emptyHint.style.display = 'none';

    var filters = {
      sku: f.sku,
      kategori: f.kategori,
      startDate: f.startDate,
      endDate: f.endDate,
      tipe: f.tipe
    };

    return callApi('getStockCardData', filters)
      .then(function (result) {
        state.allRows = result.rows || [];
        state.summary = result.summary || {};

        // Deteksi anomali audit.
        state.allRows.forEach(function (row, idx) {
          var anom = toNumberOrZero_(row.SaldoAwal) < 0;
          if (!anom && idx > 0) {
            var prev = state.allRows[idx - 1];
            if (Math.abs(toNumberOrZero_(prev.SaldoAkhir) - toNumberOrZero_(row.SaldoAwal)) > 0.0001) {
              anom = true;
            }
          }
          row._anomaly = anom;
        });

        var hasSku = !!f.sku;
        if (wrap) {
          wrap.classList.toggle('d-none', !hasSku || !state.allRows.length);
        }
        if (toolbar) {
          toolbar.style.display = hasSku ? '' : 'none';
        }

        if (!state.allRows.length) {
          tbody.innerHTML = emptyRow(7, 'Tidak ada mutasi stok pada filter yang dipilih.');
          if (emptyHint) emptyHint.style.display = '';
          if (pager) pager.innerHTML = '';
          renderCardSummary();
          return;
        }
        if (emptyHint) emptyHint.style.display = 'none';

        renderCardSummary();
        renderStockCardTable();
        renderStockCardPager();
        App.loaded.stockCard = true;
      }).catch(function (err) {
        tbody.innerHTML = emptyRow(7, 'Gagal memuat: ' + err.message);
      });
  }

  function renderStockCardTable() {

      tbody.innerHTML = emptyRow(7, 'Tidak ada mutasi stok.');
      return;
    }

    tbody.innerHTML = pageRows.map(function (row) {
      var ts = fmtTglHm(row.Timestamp);
      var anomaly = row._anomaly ? ' table-anomaly' : '';
      var tipe = normalizeKey_(row.Tipe);
      var tipeTone = tipe === 'IN' ? 'IN' : tipe === 'OUT' ? 'OUT' : tipe === 'ADJUST' ? 'ADJUST' : tipe === 'TRANSFER' ? 'TRANSFER' : tipe === 'SO' ? 'SO' : 'OPNAME';
      var sourceMeta = stockSourceMeta_(row.Source);
      var masuk = Number(row.QtyMasuk) || 0;
      var keluar = Number(row.QtyKeluar) || 0;
      var masukText = masuk > 0 ? '<span class="qty-positive">+' + fmtNum(masuk) + '</span>' : fmtNum(masuk);
      var keluarText = keluar > 0 ? '<span class="qty-negative">-' + fmtNum(keluar) + '</span>' : fmtNum(keluar);
      var pending = normalizeKey_(row.ConfirmStatus) === 'PENDING' || tipe === 'OPNAME';
      var confirmBtn = pending
        ? '<button type="button" class="btn btn-success btn-icon btn-confirm-stock" title="Konfirmasi / tolak aksi" data-action="stock-log-confirm" data-id="' + esc(row.LogID) + '" data-tipe="' + esc(tipe) + '" data-refdoc="' + esc(row.RefDoc || '') + '" data-sku="' + esc(row.SKU || '') + '" data-lokasi="' + esc(row.LokasiID || '') + '" data-from="' + esc(row.LokasiID || '') + '" data-to="' + esc(row.ToLokasiID || '') + '"><i class="fa-solid fa-check"></i></button>'
        : '<span class="cell-muted">-</span>';
      return '<tr class="' + anomaly.trim() + '">' +
        '<td class="col-waktu cell-muted">' + esc(ts) + '</td>' +
        '<td class="col-refdoc">' + esc(row.RefDoc || '-') + ' <span class="badge-source ' + sourceMeta.cls + '">' + esc(sourceMeta.label) + '</span></td>' +
        '<td class="col-tipe text-center"><span class="badge-tipe ' + tipeTone + '">' + esc(tipeTone) + '</span></td>' +
        '<td class="col-masuk text-end">' + masukText + '</td>' +
        '<td class="col-keluar text-end">' + keluarText + '</td>' +

  function openStockLogConfirm(actionButton) {
    var logID = actionButton.getAttribute('data-id');
    var tipe = normalizeKey_(actionButton.getAttribute('data-tipe'));
    var refDoc = actionButton.getAttribute('data-refdoc') || '';
    var sku = actionButton.getAttribute('data-sku') || '';
    var lokasiID = actionButton.getAttribute('data-lokasi') || '';
    var fromLocationID = actionButton.getAttribute('data-from') || lokasiID;
    var toLocationID = actionButton.getAttribute('data-to') || '';

    var actionText = tipe === 'ADJUST'
      ? 'Konfirmasi Adjustment Stok?'
      : (tipe === 'TRANSFER' ? 'Konfirmasi Transfer Stok?' : 'Konfirmasi Persetujuan Stock Opname (BASO)?');

    Swal.fire({
      icon: 'question',
      title: actionText,
      html: '<p>Mutasi <strong>' + esc(refDoc || logID) + '</strong> akan diproses.</p>' +
        '<p class="text-muted small mb-0">SKU: <strong>' + esc(sku) + '</strong> &middot; Tipe: <strong>' + esc(tipe) + '</strong></p>',
      showCancelButton: true,
      confirmButtonText: 'Konfirmasi',
      cancelButtonText: 'Batal'
    }).then(function (answer) {
      if (!answer || !answer.isConfirmed) {
        return;
      }
      var confirmedBy = App.user ? (App.user.NamaLengkap || App.user.Username) : '';
      if (tipe === 'ADJUST') {
        return withLoading(callApi('confirmStockAction', {
          action: 'ADJUSTMENT',
          sku: sku,
          lokasiID: lokasiID,
          qty: (function () { var r0 = (App.cache.stockLogs || []).filter(function (r) { return String(r.LogID) === String(logID); })[0] || {}; return (Number(r0.QtyMasuk) || 0) - (Number(r0.QtyKeluar) || 0); })(),
          refDoc: refDoc || 'ADJ',
          reason: 'Konfirmasi manual adjustment ' + refDoc,
          confirm: true,
          confirmedBy: confirmedBy
        }), 'Mengecek adjustment...');
      }
      if (tipe === 'TRANSFER') {
        return withLoading(callApi('confirmStockAction', {
          action: 'TRANSFER',
          sku: sku,
          fromLocationID: fromLocationID,
          toLocationID: toLocationID,
          qty: (function () { var r0 = (App.cache.stockLogs || []).filter(function (r) { return String(r.LogID) === String(logID); })[0] || {}; return (Number(r0.QtyMasuk) || 0) - (Number(r0.QtyKeluar) || 0); })(),
          refDoc: refDoc || 'TRF',
          reason: 'Konfirmasi manual transfer ' + refDoc,
          confirm: true,
          confirmedBy: confirmedBy
        }), 'Mengecek transfer...');
      }
      if (tipe === 'SO') {
        return withLoading(callApi('approveBASO', {
          soId: refDoc || logID,
          approvedBy: confirmedBy,
          reason: 'Konfirmasi manual BASO ' + refDoc
        }), 'Menyetujui stock opname...');
      }
      toast('info', 'Aksi Tidak Dapat Dikonfirmasi', 'Tipe mutasi ' + tipe + ' belum memiliki endpoint konfirmasi khusus.');
    });
  }

  function lazyLoad(tableKey, loader, render, force) {
    if (App.cache[tableKey] && !force) {
      render();
      return Promise.resolve();
    }
    return loader().then(function (data) {
      App.cache[tableKey] = data.rows || [];
      render();
      return data;
    }).catch(function (err) {
      console.error('lazyLoad ' + tableKey + ' gagal:', err);
      try {
        toast('error', 'Gagal Memuat Data', err && err.message ? err.message : String(err));
      } catch (toastErr) {
        // Toast bersifat opsional.
      }
      return null;
    });
  }

  function renderSimplePager(container, page, totalPages, onChange) {
    if (!container) {
      return;
    }
    container.innerHTML =
      '<div class="pager-info">Halaman <strong>' + page + '</strong> / <strong>' + Math.max(totalPages, 1) + '</strong></div>' +
      '<div class="pager-controls">' +
      '<button type="button" class="btn btn-outline-secondary" data-page="prev"' + (page > 1 ? '' : ' disabled') + '><i class="fa-solid fa-chevron-left"></i></button>' +
      '<button type="button" class="btn btn-outline-secondary" data-page="next"' + (page < totalPages ? '' : ' disabled') + '><i class="fa-solid fa-chevron-right"></i></button>' +
      '</div>';
    qa('button[data-page]', container).forEach(function (btn) {
      btn.onclick = function () {
        var dir = btn.getAttribute('data-page');
        var np = dir === 'prev' ? page - 1 : page + 1;
        if (np >= 1 && np <= Math.max(totalPages, 1)) {
          onChange(np);
        }
      };
    });
  }

  function loadMaster(force) {
    var type = App.masterType;
    var cacheKey = masterCacheKey(type);
    return lazyLoad(cacheKey, function () {
      var f = App.filters.master;
      if (type === 'users') {
        return callApi('getUsers', { search: f.search || '' }).then(function (result) {
          return { rows: result.users || [] };
        });
      }
      if (type === 'sync') {
        return callApi('getSyncHistory', { page: 1, limit: 100, search: f.search || '' }).then(function (result) {
          return { rows: result.rows || [] };
        });
      }
      return callApi('getLazyLoadData', {
        table: 'MASTER_' + type.toUpperCase(),
        page: f.page,
        limit: 100,
        search: f.search,
        filters: { sortDir: 'asc' }
      });
    }, renderMaster, force);
  }

  function masterCacheKey(type) {
    if (type === 'users') {
      return 'masterUsers';
    }
    if (type === 'sync') {
      return 'syncHistory';
    }
    return 'master' + type;
  }

  function renderMaster() {
    var key = App.masterType;
    var rows = App.cache[masterCacheKey(key)] || [];
    var tbody = q('#master-body');
    var thead = q('#master-table-head');
    var pager = q('#master-pager');
    var config = MASTER_TABLE[key];
    if (!config || !tbody || !thead) {
      return;
    }
    if (pager) {
      pager.innerHTML = '';
    }
    thead.innerHTML = '<tr>' + config.head.map(function (h, i) {
      return '<th' + (i === config.head.length - 1 ? ' class="text-end"' : '') + '>' + esc(h) + '</th>';
    }).join('') + '</tr>';

    if (!rows.length) {
      tbody.innerHTML = emptyRow(config.head.length, 'Tidak ada data.');
      return;
    }
    var f = App.filters.master;
    var start = (f.page - 1) * 100;
    var pageRows = rows.slice(start, start + 100);
    tbody.innerHTML = pageRows.map(config.row).join('');
    if (pager) {
      renderSimplePager(pager, f.page, Math.ceil(rows.length / 100), function (p) { f.page = p; loadMaster(true); });

    App.masterRows[key] = {};
    rows.forEach(function (row) {
      var id = row.SKU || row.LokasiID || row.LocationID || row.SupplierID || row.OutletID || row.UserID || row.SyncID;
      if (id) {
        App.masterRows[key][String(id).toUpperCase()] = row;

  function openDrawer(title, bodyHtml, footerHtml, size) {
    var root = q('#modal-root');
    if (!root) {
      console.error('openDrawer: #modal-root tidak ditemukan di DOM.');
      return null;
    }
    var id = 'app-drawer-modal';
    root.innerHTML =
      '<div class="modal fade" id="' + id + '" tabindex="-1" aria-hidden="true">' +
      '<div class="modal-dialog modal-dialog-centered ' + esc(size || 'modal-lg') + '">' +
      '<div class="modal-content">' +
      '<div class="modal-header"><h5 class="modal-title">' + esc(title || '') + '</h5>' +
      '<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>' +
      '<div class="modal-body" style="max-height:75vh; overflow-y:auto;">' + (bodyHtml || '') + '</div>' +
      '<div class="modal-footer">' + (footerHtml || '<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>') + '</div>' +
      '</div></div></div>';

    var element = q('#' + id);
    if (!element) {
      console.error('openDrawer: gagal membuat elemen modal.');
      return null;
    }
    var modal = new bootstrap.Modal(element, { backdrop: 'static', keyboard: true });
    safeBind(element, 'hidden.bs.modal', function () {
      root.innerHTML = '';
    });
    modal.show();
    return { el: element, modal: modal };
  }

  function loadApproval(force) {
    return lazyLoad('soHeader', function () {
      var f = App.filters.opname;
      return callApi('getLazyLoadData', {
        table: 'SO_HEADER',
        page: f.page,
        limit: 100,
        search: f.search,
        filters: { Status: ['IN_PROGRESS', 'COUNTED'], sortDir: 'desc' }
      });
    }, renderApproval, force);
  }

  function renderApproval() {
    var rows = (App.cache.soHeader || []).filter(function (row) {
      var st = normalizeKey_(row.Status);
      return st === 'IN_PROGRESS' || st === 'COUNTED';
    });
    var tbody = q('#approval-body');
    var pager = q('#approval-pager');
    setText('#approval-count', fmtNum(rows.length));
    if (!rows.length) {
      tbody.innerHTML = emptyRow(8, 'Tidak ada dokumen yang menunggu approval.');
      pager.innerHTML = '';
      return;
    }
    var f = App.filters.approval || { search: '', status: 'ALL', page: 1 };
    var start = (f.page - 1) * 100;
    var pageRows = rows.slice(start, start + 100);
    tbody.innerHTML = pageRows.map(function (row) {
      var progress = Number(row.Progress) || 0;
      var countedLines = Number(row.CountedLines) || 0;
      return '<tr>' +
        '<td class="cell-strong">' + esc(row.SO_ID) + '</td>' +
        '<td class="cell-muted">' + esc(shortDate(row.TanggalSO)) + '</td>' +
        '<td>' + esc(row.Cakupan || '-') + '</td>' +
        '<td class="text-end">' + fmtNum(row.TotalSKU || row.TotalLines) + '</td>' +
        '<td class="text-end">' + progress + '%<span class="cell-sub">' + fmtNum(countedLines) + ' dihitung</span></td>' +
        '<td class="text-end">' + (countedLines ? qtyCell(row.TotalVariance) : '-') + '</td>' +
        '<td>' + statusBadge(row.Status) + '</td>' +
        '<td class="text-end">' +
        '<button type="button" class="btn btn-outline-secondary btn-icon" title="Review & approve" data-action="opname-variance" data-id="' + esc(row.SO_ID) + '"><i class="fa-solid fa-check-double"></i></button>' +
        '</td>' +
        '</tr>';
    }).join('');
    renderSimplePager(pager, f.page, Math.ceil(rows.length / 100), function (p) { f.page = p; loadApproval(true); });
  }

  function masterFieldHtml(field, record) {
    var value = record && record[field.key] !== undefined && record[field.key] !== null ? record[field.key] : (field.defaultValue || '');
    var readonly = field.readonly ? ' readonly' : '';
    var required = field.required ? ' required' : '';
    var label = '<label class="form-label">' + esc(field.label) + '</label>';

    if (field.type === 'select') {
      var options = field.options || [];
      var optionsHtml = '';
      if (field.placeholder !== undefined) {
        optionsHtml += '<option value="">' + esc(field.placeholder) + '</option>';
      }
      options.forEach(function (option) {
        var optionValue = typeof option === 'string' ? option : option.value;
        var optionLabel = typeof option === 'string' ? option : option.label;
        optionsHtml += '<option value="' + esc(optionValue) + '"' + (String(value) === String(optionValue) ? ' selected' : '') + '>' + esc(optionLabel) + '</option>';
      });
      return '<div class="' + (field.col || 'col-md-6') + '">' + label +
        '<select class="form-select" name="' + esc(field.key) + '"' + required + '>' + optionsHtml + '</select></div>';
    }

    if (field.type === 'textarea') {
      return '<div class="' + (field.col || 'col-12') + '">' + label +
        '<textarea class="form-control" name="' + esc(field.key) + '" rows="2"' + readonly + required + '>' + esc(value) + '</textarea></div>';
    }

    return '<div class="' + (field.col || 'col-md-6') + '">' + label +
      '<input type="' + esc(field.type || 'text') + '" class="form-control" name="' + esc(field.key) + '" value="' + esc(value) + '"' + readonly + required + '></div>';
  }

  function setActiveNav(view) {
    qa('[data-view]').forEach(function (item) {
      if (!item.classList.contains('sidebar-link')) {
        return;
      }
      item.classList.toggle('active', item.getAttribute('data-view') === view);
    });
  }

  function showView(view, force) {
    var meta = VIEW_META[view];
    if (!meta) {
      view = App.role === 'ADMIN' ? 'dashboard' : 'inventory';
      meta = VIEW_META[view];
    }
    if (meta.permission && !can(meta.permission)) {
      view = App.role === 'ADMIN' ? 'dashboard' : 'inventory';
      meta = VIEW_META[view];
    }

    App.activeView = view;
    qa('.app-view').forEach(function (section) {
      section.classList.toggle('active', section.id === 'view-' + view);
    });
    setActiveNav(view);

    setText('#page-title', meta.title);
    setText('#page-subtitle', meta.subtitle);
    document.body.classList.remove('sidebar-open');

    if (App.booted) {
      ensureViewData(view, force);
    }
  }

  function ensureViewData(view, force) {
    if (view === 'dashboard') {
      loadInitialAppData().catch(function () {});
      return;
    }
    if (view === 'inventory') {
      loadOptions().catch(function () {});
      if (App.invTab === 'logs') {
        loadStockCard();
      } else {
        loadStockMonitoring(force);
      }
      return;
    }
    if (view === 'inbound') {
      if (App.inboundTab === 'receiving') {
        loadInboundReceiving(force);
      } else if (App.inboundTab === 'quarantine') {
        loadQuarantine(force);
      } else {
        loadClaims(force);
      }
      return;
    }
    if (view === 'outbound') {
      if (App.outboundTab === 'orders') {
        loadOutboundOrders(force);
      } else if (App.outboundTab === 'picking') {
        loadPickingList(force);
      } else {
        loadDispatchManifest(force);
      }
      return;
    }
    if (view === 'opname') {
      loadOpname(force);
      return;
    }
    if (view === 'master') {
      loadMaster(force);
      return;
    }
    if (view === 'users') {
      loadUsers(force);
      return;
    }
    if (view === 'sync') {
      loadSync(force);
      return;
    }
    if (view === 'adjustment') {
      loadOptions().then(function () {
        populateAdjustmentForms();
      }).catch(function () {});
      loadAdjustmentLogs(force);
      return;
    }
    if (view === 'approval') {
      loadApproval(force);
      return;
    }
  }

  function bindAuthEvents() {
    // Form login ditangani oleh onsubmit="return handleLogin(event)" di HTML,
    // jangan pasang listener submit di sini untuk menghindari double handling.

    var toggle = q('#login-password-toggle');
    if (toggle) {
      safeBind(toggle, 'click', function () {
        var input = q('#login-password');
        var icon = toggle.querySelector('i');
        if (!input) {
          return;
        }
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        if (icon) {
          icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        }
        toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
      });
    }

    var year = q('#login-year');
    if (year) {
      year.textContent = String(new Date().getFullYear());
    }

    var logout = q('#btn-logout');
    if (logout) {
      safeBind(logout, 'click', function () {
        Swal.fire({
          icon: 'question',
          title: 'Keluar dari aplikasi?',
          text: 'Sesi Anda akan diakhiri dan halaman login ditampilkan kembali.',
          showCancelButton: true,
          confirmButtonText: 'Ya, keluar',
          cancelButtonText: 'Batal'
        }).then(function (choice) {
          if (choice && choice.isConfirmed) {
            logoutUser();
          }
        });
      });
    }
  }

    });
    safeBind('#stock-monitor-export', 'click', exportMonitorCsv);

    /* Toolbar: + Input Baru & Sync pada modul inventory */
    safeBind('#stock-monitor-sync', 'click', function (event) {
      event.preventDefault();
      runSync(true);
    });

    var chipsContainer = q('#stock-monitor-status-chips');
    if (chipsContainer) {
      safeBind(chipsContainer, 'click', function (event) {
        var chip = event.target.closest('.status-chip');
        if (!chip) {
          return;
        }
        App.filters.stockMonitor.status = chip.getAttribute('data-status');
        applyStockMonitorFilters();
        renderStockMonitorTable();
        renderStockMonitorFooter();
        renderStockMonitorPager();
        renderStockMonitorStatusChips();
      });
    }

    /* Pager delegation: Monitoring Stok & Kartu Stok */
    ['#stock-monitor-pager', '#stock-card-pager'].forEach(function (sel) {
      var cont = q(sel);
      if (!cont) {
        return;
      }
      safeBind(cont, 'click', function (event) {
        var btn = event.target.closest('button[data-page]');
        if (!btn) {
          return;
        }
        var isMonitor = sel === '#stock-monitor-pager';
        var f = isMonitor ? App.filters.stockMonitor : App.filters.stockCard;
        var total = isMonitor ? App.states.stockMonitor.filteredRows.length : App.states.stockCard.allRows.length;
        var totalPages = Math.max(Math.ceil(total / f.pageSize), 1);
        var dir = btn.getAttribute('data-page');
        var np = dir === 'prev' ? f.page - 1 : f.page + 1;
        if (np >= 1 && np <= totalPages) {
          f.page = np;
          if (isMonitor) {
            renderStockMonitorTable();
            renderStockMonitorFooter();
            renderStockMonitorPager();
          } else {
            renderStockCardTable();
            renderStockCardPager();
          }
        }

        openQuarantineDisposition(actionButton.getAttribute('data-id'));

        '<input type="number" class="form-control" name="qtyBaik" id="inbound-rcv-qtyBaik" min="0" step="1" placeholder="Kosongkan = semua baik"></div>' +
        '<div class="col-md-6"><label class="form-label">Qty Cacat</label>' +

        event.preventDefault();
        var form = event.target;
        var qtyDiterima = Number(form.elements.qtyDiterima ? form.elements.qtyDiterima.value : 0) || 0;
        var qtyBaik = Number(form.elements.qtyBaik ? form.elements.qtyBaik.value : 0) || qtyDiterima;
        var qtyCacat = Math.max(0, qtyDiterima - qtyBaik);
        var payload = {
          noSJ: form.elements.noSJ ? (form.elements.noSJ.value || '').trim() : '',
          supplierID: form.elements.supplierID ? (form.elements.supplierID.value || '') : '',
          items: [{
            sku: form.elements.sku ? (form.elements.sku.value || '') : '',
            lokasiID: form.elements.lokasiID ? (form.elements.lokasiID.value || '') : '',
            qtyDiterima: qtyDiterima,
            qtyBaik: qtyBaik,
            qtyCacat: qtyCacat,
            note: form.elements.note ? (form.elements.note.value || '') : ''
          }],
          createdBy: App.user ? (App.user.NamaLengkap || App.user.Username) : ''
        };
        withLoading(callApi('processReceiving', payload), 'Menyimpan Receiving...')
          .then(function (result) {

            App.cache.quarantine = null;

            loadInitialAppData().catch(function () {});
            loadInboundReceiving(true);
          })
          .catch(function (err) { showError(err, 'Simpan Receiving Gagal'); });
      });
    }).catch(function (err) { showError(err, 'Gagal Memuat Opsi Inbound'); });
  }

  function openQuickCreate(actionButton) {
    var module = normalizeKey_(actionButton.getAttribute('data-module'));
    if (module === 'INVENTORY' || module === 'STOCK') {
      var searchInput = q('#stock-monitor-produk');
      var sku = String((searchInput && searchInput.value) || '').trim();
      if (!sku) {
        toast('info', 'Input Baru', 'Isi kolom pencarian SKU / nama barang terlebih dahulu, lalu buka form adjustment.');
        return;
      }
      openAdjustmentModal({ sku: sku });
      return;
    }
    if (module === 'INBOUND') {
      openInboundReceivingModal();
      return;
    }
    if (module === 'OUTBOUND') {
      toast('info', 'Input Baru', 'Input outbound / pengiriman via form web disimpan melalui OUTBOUND_CONFIRMATIONS setelah diproses picking.');
      return;
    }
    if (module === 'STOCK_OPNAME' || module === 'OPNAME') {
      toast('info', 'Input Baru', 'Stock opname via web menggunakan alur blind count dan BASO approval.');
      return;
    }
    toast('info', 'Input Baru', 'Form input untuk modul ' + module + ' belum tersedia.');
  }

  function openTxnConfirm(actionButton) {
    var module = normalizeKey_(actionButton.getAttribute('data-module'));
    var id = actionButton.getAttribute('data-id') || '';
    var statusShipment = actionButton.getAttribute('data-status') || '';
    var idFields = {
      INBOUND_RECEIVING: 'RcvID',
      QUARANTINE_RETUR: 'QID',
      RETURNS_CLAIMS: 'ClaimID',
      OUTBOUND_ORDERS: 'OrderID',
      DISPATCH_MANIFEST: 'ManifestID',
      STOCK_OPNAME: 'SO_ID'
    };
    var idField = idFields[module] || 'ID';
    var rows = [];
    var cacheMap = {
      INBOUND_RECEIVING: App.cache.inboundReceiving,
      QUARANTINE_RETUR: App.cache.quarantine,
      RETURNS_CLAIMS: App.cache.claims,
      OUTBOUND_ORDERS: App.cache.outboundOrders,
      DISPATCH_MANIFEST: App.cache.dispatchManifest,
      STOCK_OPNAME: App.cache.soHeader
    };
    rows = cacheMap[module] || [];
    var row = null;
    for (var i = 0; i < rows.length; i++) {
      if (String(rows[i][idField] || '') === String(id)) { row = rows[i]; break; }
    }

    var confirmedBy = App.user ? (App.user.NamaLengkap || App.user.Username) : '';

    if (module === 'INBOUND_RECEIVING') {
      Swal.fire({
        icon: 'question',
        title: 'Konfirmasi Penerimaan Inbound?',
        text: 'Aksi <strong>' + esc(id) + '</strong> akan diproses. Anda yakin ingin melanjutkan?',
        showCancelButton: true,
        showDenyButton: true,
        confirmButtonText: 'Konfirmasi',
        denyButtonText: 'Tolak',
        denyButtonColor: '#DC2626',
        cancelButtonText: 'Batal'
      }).then(function (answer) {
        if (!answer || !answer.isConfirmed) { return; }
        var action = answer.isDenied ? 'REJECT' : 'CONFIRM';
        return withLoading(callApi('confirmInboundReceiving', { rcvID: id, action: action, confirmedBy: confirmedBy }), action === 'CONFIRM' ? 'Mengecek receiving...' : 'Menolak receiving...');
      }).catch(function (err) { showError(err, 'Konfirmasi Receiving Gagal'); });
      return;
    }

    if (module === 'QUARANTINE_RETUR') {
      Swal.fire({
        title: 'Ubah Disposisi Karantina?',
        icon: 'question',
        input: 'select',
        inputOptions: {
          RETUR: 'Retur ke Supplier',
          REPLACEMENT: 'Penggantian',
          AFKIR: 'Afkir'
        },
        inputPlaceholder: 'Pilih disposisi',
        showCancelButton: true,
        confirmButtonText: 'Simpan',
        cancelButtonText: 'Batal'
      }).then(function (answer) {
        if (!answer || !answer.isConfirmed) { return; }
        return withLoading(callApi('confirmQuarantineDisposition', { qid: id, disposition: answer.value, action: 'CONFIRM', confirmedBy: confirmedBy }), 'Menyimpan disposisi...');
      }).catch(function (err) { showError(err, 'Disposisi Karantina Gagal'); });
      return;
    }

    if (module === 'RETURNS_CLAIMS') {
      Swal.fire({
        icon: 'question',
        title: 'Konfirmasi Tindakan Klaim Return?',
        text: 'Aksi untuk claim <strong>' + esc(id) + '</strong> akan diproses.',
        showCancelButton: true,
        showDenyButton: true,
        confirmButtonText: 'Konfirmasi',
        denyButtonText: 'Tolak',
        denyButtonColor: '#DC2626',
        cancelButtonText: 'Batal'
      }).then(function (answer) {
        if (!answer || !answer.isConfirmed) { return; }
        var actionDisposition = actionButton.getAttribute('data-disposition') || 'RETUR';
        var action = answer.isDenied ? 'REJECT' : 'CONFIRM';
        return withLoading(callApi('confirmReturnClaim', { claimID: id, actionDisposition: actionDisposition, action: action, confirmedBy: confirmedBy }), 'Memproses klaim return...');
      }).catch(function (err) { showError(err, 'Konfirmasi Klaim Return Gagal'); });
      return;
    }

    if (module === 'OUTBOUND_ORDERS') {
      Swal.fire({
        icon: 'question',
        title: 'Konfirmasi Outbound / Pengiriman?',
        text: 'Konfirmasi <strong>' + esc(id) + '</strong> akan disimpan ke OUTBOUND_CONFIRMATIONS.',
        showCancelButton: true,
        confirmButtonText: 'Konfirmasi',
        cancelButtonText: 'Batal'
      }).then(function (answer) {
        if (!answer || !answer.isConfirmed) { return; }
        return withLoading(callApi('submitOutboundConfirmation', {
          orderID: id,
          noPO: actionButton.getAttribute('data-nopo') || '',
          type: actionButton.getAttribute('data-type') || 'ORDER',
          picName: actionButton.getAttribute('data-pic') || confirmedBy,
          notes: actionButton.getAttribute('data-notes') || '',
          source: 'Web',
          confirm: true
        }), 'Menyimpan konfirmasi outbound...');
      }).catch(function (err) { showError(err, 'Konfirmasi Outbound Gagal'); });
      return;
    }

    if (module === 'DISPATCH_MANIFEST') {
      Swal.fire({
        icon: 'question',
        title: 'Konfirmasi Status Pengiriman?',
        text: 'Status pengiriman <strong>' + esc(id) + '</strong> akan diperbarui.',
        input: 'select',
        inputOptions: { SHIPPED: 'Dikirim (SHIPPED)', DELIVERED: 'Terkonfirmasi Terkirim (DELIVERED)' },
        inputValue: statusShipment || 'SHIPPED',
        showCancelButton: true,
        confirmButtonText: 'Simpan',
        cancelButtonText: 'Batal'
      }).then(function (answer) {
        if (!answer || !answer.isConfirmed) { return; }
        return withLoading(callApi('confirmManifestShipment', { manifestID: id, statusShipment: answer.value, action: 'CONFIRM', confirmedBy: confirmedBy }), 'Memperbarui status pengiriman...');
      }).then(function (result) {
        if (result && result.statusShipment) {
          toast('success', 'Status Pengiriman Diperbarui', 'Manifest ' + id + ' -> ' + result.statusShipment + '.');
          App.cache.dispatchManifest = null;
          loadDispatchManifest(true);
        }
      }).catch(function (err) { showError(err, 'Konfirmasi Pengiriman Gagal'); });
      return;
    }

    if (module === 'STOCK_OPNAME') {
      Swal.fire({
        icon: 'question',
        title: 'Konfirmasi Stock Opname (BASO)?',
        text: 'SO <strong>' + esc(id) + '</strong> akan diproses.',
        showCancelButton: true,
        confirmButtonText: 'Konfirmasi',
        cancelButtonText: 'Batal'
      }).then(function (answer) {
        if (!answer || !answer.isConfirmed) { return; }
        return withLoading(callApi('approveBASO', { soId: id, approvedBy: confirmedBy, reason: 'Konfirmasi BASO ' + id }), 'Menyetujui stock opname...');
      }).then(function () {
        App.cache.soHeader = null;
        App.cache.stockLogs = null;
        App.loaded.stockMonitor = false;
        App.loaded.stockCard = false;
        loadInitialAppData().catch(function () {});
      }).catch(function (err) { showError(err, 'Konfirmasi Stock Opname Gagal'); });
      return;
    }
  }
