        var receiving = detail.receiving || {};
        var detailRows = detail.details || [];
        var quarantine = detail.quarantine || [];
        var body =
          '<div class="detail-grid mb-3">' +
          detailItem('RCV ID', receiving.RcvID) +
          detailItem('No Surat Jalan', receiving.NoSJ) +
          detailItem('Supplier', receiving.SupplierName || receiving.SupplierID) +
          detailItem('Lokasi', receiving.LokasiID) +
          detailItem('Tanggal', receiving.TanggalDatang) +
          detailItem('Status QC', receiving.StatusQC) +
          '</div>' +
          '<div class="section-label"><span>Detail Barang</span><span>' + detailRows.length + ' baris</span></div>' +
          '<div class="table-responsive"><table class="table modal-table align-middle"><thead><tr><th>SKU</th><th>Barang</th><th>Lokasi</th><th class="text-end">Diterima</th><th class="text-end">Baik</th><th class="text-end">Cacat</th><th>Status QC</th></tr></thead><tbody>' +
          (detailRows.length ? detailRows.map(function (row) {
            return '<tr><td class="cell-strong">' + esc(row.SKU) + '</td><td>' + esc(row.NamaBarang) + '</td><td>' + esc(row.LokasiID || row.LocationID || '-') + '</td><td class="text-end">' + fmtNum(row.QtyDiterima) + '</td><td class="text-end">' + fmtNum(row.QtyBaik) + '</td><td class="text-end">' + fmtNum(row.QtyCacat) + '</td><td>' + statusBadge(row.StatusQC) + '</td></tr>';
          }).join('') : emptyRow(7, 'Tidak ada detail.')) +
          '</tbody></table></div>' +
          (quarantine.length ? (
            '<div class="section-label mt-3"><span>Quarantine (' + quarantine.length + ' baris)</span></div>' +
            '<div class="table-responsive"><table class="table modal-table align-middle"><thead><tr><th>QID</th><th>SKU</th><th class="text-end">Qty</th><th>Alasan</th><th>Disposition</th><th>Status</th></tr></thead><tbody>' +
            quarantine.map(function (row) {
              return '<tr><td>' + esc(row.QID) + '</td><td>' + esc(row.SKU) + '</td><td class="text-end">' + fmtNum(row.QtyCacat) + '</td><td>' + esc(row.Reason || '-') + '</td><td>' + esc(row.Disposition || '-') + '</td><td>' + statusBadge(row.Status) + '</td></tr>';
            }).join('') +
            '</tbody></table></div>'
          ) : '');

        openDrawer('Detail Receiving ' + esc(rcvID), body,
          '<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Tutup</button>',
          'modal-xl');
      })
      .catch(function (err) { showError(err, 'Gagal Memuat Detail'); });
  }

  function openQuarantineDisposition(qid) {
    Swal.fire({
      title: 'Ubah Disposisi Karantina?',
      text: 'Pilih tindakan untuk QID ' + qid + '.',
      input: 'select',
      inputOptions: {
        'RETUR': 'Retur ke Supplier',
        'REPLACEMENT': 'Penggantian',
        'AFKIR': 'Afkir'
      },
      inputPlaceholder: 'Pilih disposisi',
      showCancelButton: true,
      confirmButtonText: 'Simpan',
      cancelButtonText: 'Batal'
    }).then(function (answer) {
      if (!answer.isConfirmed) {
        return;
      }
      var disposition = answer.value;
      withLoading(callApi('processQuarantineDisposition', { qid: qid, disposition: disposition }), 'Menyimpan disposisi...')
        .then(function (result) {
          toast('success', 'Disposisi tersimpan', 'QID ' + qid + ' diubah menjadi ' + result.status + '.');
          App.cache.quarantine = null;
          loadQuarantine(true);
        })
        .catch(function (err) { showError(err, 'Disposisi Gagal'); });
    });
  }

  function openOutboundStatus(orderID, currentStatus) {
    var current = String(currentStatus || '').toUpperCase();
    var OUTBOUND_TRANSITIONS = {
      CONFIRMED: ['PICKING', 'CANCELLED'],
      PICKING: ['CHECKING', 'CANCELLED'],
      CHECKING: ['PACKED', 'CANCELLED'],
      PACKED: ['DISPATCHED', 'CANCELLED'],
      DISPATCHED: ['COMPLETED'],
      COMPLETED: [],
      CANCELLED: []
    };
    var nextStatuses = OUTBOUND_TRANSITIONS[current] || [];
    if (!nextStatuses.length) {
      Swal.fire({
        icon: 'info',
        title: 'Status Final',
        text: 'Order ' + orderID + ' sudah berstatus ' + current + ' dan tidak memiliki transisi berikutnya.',
        confirmButtonText: 'Tutup'
      });
      return;
    }

    var options = nextStatuses.map(function (status) {
      return '<option value="' + status + '">' + status + '</option>';
    }).join('');

    var body =
      '<form id="status-form">' +
      '<div class="alert alert-light border mb-3"><strong>' + esc(orderID) + '</strong><br><span class="text-muted small">Status saat ini: ' + esc(current) + '</span></div>' +
      '<label class="form-label">Status Baru</label>' +
      '<select class="form-select" name="newStatus" required>' + options + '</select>' +
      '<div id="dispatch-fields" class="d-none mt-3">' +
      '<div class="row g-2">' +
      '<div class="col-md-4"><label class="form-label">Ekspedisi</label><input type="text" class="form-control" name="ekspedisi" placeholder="Contoh: JNE"></div>' +
      '<div class="col-md-4"><label class="form-label">No Resi / AWB</label><input type="text" class="form-control" name="noResi" placeholder="Opsional"></div>' +
      '<div class="col-md-4"><label class="form-label">Driver</label><input type="text" class="form-control" name="driverName" placeholder="Nama driver"></div>' +
      '</div>' +
      '</div>' +
      '</form>';

    openDrawer('Update Status Order ' + esc(orderID), body,
      '<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>' +
      '<button type="submit" form="status-form" class="btn btn-primary"><i class="fa-solid fa-check"></i> Update Status</button>',
      'modal-lg');

    var drawerRoot = q('#app-drawer-modal') || document;
    var statusSelect = q('#status-form', drawerRoot);
    statusSelect = statusSelect ? statusSelect.querySelector('select[name="newStatus"]') : null;
    var dispatchFields = q('#dispatch-fields', drawerRoot);

    if (statusSelect && dispatchFields) {
      var toggleDispatch = function () {
        dispatchFields.classList.toggle('d-none', statusSelect.value !== 'DISPATCHED');
      };
      safeBind(statusSelect, 'change', toggleDispatch);
      toggleDispatch();
    }

    safeBind(q('#status-form', drawerRoot), 'submit', function (event) {
      event.preventDefault();
      var form = event.target;
      var target = form.elements.newStatus.value;
      var payload = {
        orderId: orderID,
        newStatus: target,
        ekspedisi: form.elements.ekspedisi ? form.elements.ekspedisi.value : '',
        noResi: form.elements.noResi ? form.elements.noResi.value : '',
        driverName: form.elements.driverName ? form.elements.driverName.value : ''
      };

      withLoading(callApi('updateOrderStatus', payload), 'Memperbarui status...')
        .then(function (result) {
          var _closeBtn = q('#app-drawer-modal .modal .btn-close'); if (_closeBtn) { _closeBtn.click(); }
          toast('success', 'Status diperbarui', orderID + ' -> ' + result.statusOrder + '.');
          App.cache.outboundOrders = null;
          App.cache.dispatchManifest = null;
          loadOutboundOrders(true);
          loadInitialAppData().catch(function () {});
        })
        .catch(function (err) { showError(err, 'Update Status Gagal'); });
    });
  }

  function loadAdjustmentLogs(force) {
    var tbody = q('#adjustment-logs-body');
    if (!tbody) {
      return;
    }
    setTableLoading(tbody, 9, 'Memuat riwayat adjustment...');
    return callApi('getLazyLoadData', {
      table: 'STOCK_LOGS',
      page: 1,
      limit: 500,
      search: '',
      filters: { Tipe: ['ADJUST', 'TRANSFER'], sortDir: 'desc' }
    }).then(function (result) {
      var rows = result.rows || [];
      if (!rows.length) {
        tbody.innerHTML = emptyRow(9, 'Belum ada adjustment atau transfer.');
      } else {
        tbody.innerHTML = rows.map(function (row) {
          return '<tr>' +
            '<td class="cell-muted">' + esc(shortDate(row.Timestamp)) + '</td>' +
            '<td class="cell-strong">' + esc(row.SKU) + '</td>' +
            '<td>' + esc(row.NamaBarang || '-') + '</td>' +
            '<td>' + statusBadge(row.Tipe) + '</td>' +
            '<td class="text-end">' + (Number(row.QtyMasuk) ? qtyCell(row.QtyMasuk) : '<span class="qty-zero">0</span>') + '</td>' +
            '<td class="text-end">' + (Number(row.QtyKeluar) ? qtyCell(-Math.abs(Number(row.QtyKeluar))) : '<span class="qty-zero">0</span>') + '</td>' +
            '<td class="text-end"><strong>' + fmtNum(row.SaldoAkhir) + '</strong></td>' +
            '<td class="cell-muted">' + esc(row.RefDoc || '-') + '</td>' +
            '<td class="cell-muted">' + esc(row.User || '-') + '</td>' +
            '</tr>';
        }).join('');
      }
    }).catch(function (err) {
      tbody.innerHTML = emptyRow(9, 'Gagal memuat: ' + err.message);
    });
  }

  /* ====================================================================== */
  /* SYNC / AUTO                                                            */
  /* ====================================================================== */

  function runSync(force) {
    if (App.autoSyncBusy) {
      toast('info', 'Sinkronisasi berjalan', 'Mohon tunggu proses sinkronisasi sebelumnya selesai.');
      return Promise.resolve(null);
    }
    App.autoSyncBusy = true;
    showLoading(force ? 'Force sync data logs...' : 'Menyinkronkan data logs...');

    return callApi('syncAllLogsAndRecalculateStock', {
      force: !!force,
      triggeredBy: force ? 'MANUAL_FORCE' : 'MANUAL'
    })
      .then(function (result) {
        hideLoading();
        if (result && result.skipped) {
          toast('info', 'Sync dilewati', result.reason || 'Sinkronisasi masih dalam interval.');
        } else {
          toast(
            'success',
            'Sinkronisasi selesai',
            (result.logsCreated || 0) + ' log baru, ' + (result.skuRecalculated || 0) + ' SKU dihitung ulang.'
          );
        }
        // Invalidate caches so next tab open fetches fresh data.
        App.cache.stockLogs = null;
        App.cache.inboundReceiving = null;
        App.cache.outboundOrders = null;
        App.cache.pickingList = null;
        App.cache.dispatchManifest = null;
        App.cache.soHeader = null;
        App.cache.soDetail = null;
        App.loaded.stockMonitor = false;
        App.loaded.stockCard = false;
        App.loaded.opname = false;
        loadInitialAppData().catch(function () {});
        if (App.activeView === 'inventory') {
          if (App.invTab === 'logs') {
            loadStockCard();
          } else {
            loadStockMonitoring(true);
          }
        } else if (App.activeView === 'sync') {
          loadSync(true);
        }
      })
      .catch(function (err) {
        hideLoading();
        showError(err, 'Sinkronisasi Gagal');
      })
      .then(function () {
        App.autoSyncBusy = false;
      });
  }

  function startAutoSync() {
    if (App.autoSyncTimer) {
      clearInterval(App.autoSyncTimer);
    }
    App.autoSyncTimer = setInterval(function () {
      runAutoSync('AUTO_REFRESH');
    }, 30 * 1000);
    // Silent auto-sync default 30 detik untuk tab aktif.
  }

  function runAutoSync(triggerName) {
    if (!App.token || App.autoSyncBusy) {
      return;
    }
    App.autoSyncBusy = true;
    callApi('syncAllLogsAndRecalculateStock', { triggeredBy: triggerName || 'AUTO_REFRESH' })
      .then(function (result) {
        if (result && !result.skipped) {
          App.cache.stockLogs = null;
          App.cache.inboundReceiving = null;
          App.loaded.stockMonitor = false;
          App.loaded.stockCard = false;
          loadInitialAppData().catch(function () {});
          if (App.activeView === 'inventory') {
            if (App.invTab === 'logs') {
              loadStockCard();
            } else {
              loadStockMonitoring(true);
            }
          }
        }
      })
      .then(function () {
        App.autoSyncBusy = false;
      })
      .catch(function () {
        App.autoSyncBusy = false;
      });
  }

  function startPing() {
    if (App.pingTimer) {
      clearInterval(App.pingTimer);
    }
    App.pingTimer = setInterval(function () {
      callApi('ping').then(function (data) {
        setServerStatus('online', 'Server Online', data.serverTime);
      }).catch(function () {
        setServerStatus('offline', 'Server Offline', '');
      });
    }, 60000);
  }

  /* ====================================================================== */
  /* BOOT                                                                   */
  /* ====================================================================== */

  function boot() {
    try {
      setText('#sidebar-version', App.version);
      bindAuthEvents();

      var restored = restoreLogin();
      if (!restored) {
        showLoginScreen('');
        var username = q('#login-username');
        if (username) {
          setTimeout(function () {
            try {
              username.focus();
            } catch (err) {
              // Focus is best-effort.
            }
          }, 120);
        }
      }
    } catch (err) {
      console.error('Boot error:', err);
      // Paksa tampilan login screen meski boot gagal, jangan biarkan blank.
      try {
        document.body.classList.add('auth-mode');
        var root = q('#app-root');
        if (root) {
          root.classList.remove('app-visible');
        }
        var screen = q('#login-screen');
        if (screen) {
          screen.classList.remove('is-leaving');
          screen.style.display = 'flex';
        }
        showLoginError('Gagal memuat aplikasi: ' + (err && err.message ? err.message : String(err)));
      } catch (err2) {
        console.error('Boot fallback error:', err2);
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      try {
        boot();
      } catch (err) {
        console.error('DOMContentLoaded boot error:', err);
        try {
          document.body.classList.add('auth-mode');
          var screen = document.querySelector('#login-screen');
          if (screen) {
            screen.style.display = 'flex';
            screen.classList.remove('is-leaving');
          }
          var root = document.querySelector('#app-root');
          if (root) {
            root.classList.remove('app-visible');
          }
        } catch (err2) {
          console.error('DOMContentLoaded fallback error:', err2);
        }
      }
    });
  } else {
    try {
      boot();
    } catch (err) {
      console.error('Immediate boot error:', err);
      try {
        document.body.classList.add('auth-mode');
        var screen = document.querySelector('#login-screen');
        if (screen) {
          screen.style.display = 'flex';
          screen.classList.remove('is-leaving');
        }
        var root = document.querySelector('#app-root');
        if (root) {
          root.classList.remove('app-visible');
        }
      } catch (err2) {
        console.error('Immediate boot fallback error:', err2);
      }
    }
  }

  // Expose inti UI ke global scope agar fallback login di Index.html dapat
  // memanggil enterApp() langsung tanpa reload halaman.
  window.enterApp = enterApp;
  window.wmsShowView = showView;
  window.wmsApp = App;
})();
</script>
